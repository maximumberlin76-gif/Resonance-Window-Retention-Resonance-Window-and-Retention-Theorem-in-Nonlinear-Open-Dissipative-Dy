          def verify_zip_integrity(
              package_path: Path,
          ) -> None:
              with zipfile.ZipFile(
                  package_path,
                  "r",
              ) as archive:
                  damaged_member = (
                      archive.testzip()
                  )

                  if damaged_member is not None:
                      raise SystemExit(
                          "ZIP integrity failure in "
                          f"{package_path.name}: "
                          f"{damaged_member}"
                      )


