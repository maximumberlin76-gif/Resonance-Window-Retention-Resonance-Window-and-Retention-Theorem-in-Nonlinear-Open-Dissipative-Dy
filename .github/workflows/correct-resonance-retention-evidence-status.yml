          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()


          def verify_source_state() -> None:
              evidence_path = ROOT / "EVIDENCE_STATUS.md"

              if evidence_path.exists():
                  raise SystemExit(
                      "EVIDENCE_STATUS.md already exists; "
                      "the correction may already have been applied"
                  )

              for rel, expected in EXPECTED_PACKAGE_HASHES.items():
                  path = ROOT / rel

                  if not path.is_file():
                      raise SystemExit(
                          f"Missing expected source package: {rel}"
                      )

                  actual = sha256_file(path)

                  if actual != expected:
                      raise SystemExit(
                          f"Source-package mismatch for {rel}:\n"
                          f"expected {expected}\n"
                          f"actual   {actual}"
                      )

              for rel, markers in TEXT_SOURCE_MARKERS.items():
                  path = ROOT / rel

                  if not path.is_file():
                      raise SystemExit(
                          f"Missing expected source document: {rel}"
                      )

                  text = path.read_text(
                      encoding="utf-8"
                  )

                  for marker in markers:
                      count = text.count(marker)

                      if count != 1:
                          raise SystemExit(
                              f"Source-document marker mismatch in {rel}:\n"
                              f"expected exactly 1 occurrence, found {count}\n"
                              f"marker: {marker}"
                          )

              print(
                  "Source packages and document markers verified."
              )


          def replace_once(
              text: str,
              old: str,
              new: str,
              label: str,
          ) -> str:
              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly "
                      f"one source block, found {count}"
                  )

              return text.replace(old, new)


          def write_text(
              path: Path,
              text: str,
          ) -> None:
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              path.write_text(
                  text.rstrip() + "\n",
                  encoding="utf-8",
                  newline="\n",
              )


          def write_json(
              path: Path,
              data: object,
          ) -> None:
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              path.write_text(
                  json.dumps(
                      data,
                      indent=2,
                      ensure_ascii=False,
                  )
                  + "\n",
                  encoding="utf-8",
                  newline="\n",
              )


          def safe_extract(
              zip_path: Path,
              target: Path,
          ) -> None:
              target.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              with zipfile.ZipFile(
                  zip_path,
                  "r",
              ) as archive:
                  for info in archive.infolist():
                      relative = Path(
                          info.filename
                      )

                      if (
                          relative.is_absolute()
                          or ".." in relative.parts
                      ):
                          raise SystemExit(
                              "Unsafe ZIP member in "
                              f"{zip_path}: "
                              f"{info.filename}"
                          )

                  archive.extractall(target)


          def pack_zip(
              source: Path,
              destination: Path,
          ) -> None:
              temporary = destination.with_suffix(
                  destination.suffix + ".tmp"
              )

              if temporary.exists():
                  temporary.unlink()

              with zipfile.ZipFile(
                  temporary,
                  "w",
                  compression=zipfile.ZIP_DEFLATED,
                  compresslevel=9,
              ) as archive:
                  files = sorted(
                      path
                      for path in source.rglob("*")
                      if path.is_file()
                  )

                  for path in files:
                      relative = path.relative_to(
                          source
                      ).as_posix()

                      info = zipfile.ZipInfo(
                          relative,
                          date_time=FIXED_ZIP_TIME,
                      )

                      info.compress_type = (
                          zipfile.ZIP_DEFLATED
                      )

                      mode = (
                          0o755
                          if path.suffix == ".py"
                          else 0o644
                      )

                      info.external_attr = (
                          mode & 0xFFFF
                      ) << 16

                      info.create_system = 3

                      archive.writestr(
                          info,
                          path.read_bytes(),
                      )

              os.replace(
                  temporary,
                  destination,
              )


          def write_manifest(
              root: Path,
              manifest_rel: str,
          ) -> None:
              manifest = root / manifest_rel
              lines: list[str] = []

              files = sorted(
                  path
                  for path in root.rglob("*")
                  if path.is_file()
              )

              for path in files:
                  relative = path.relative_to(
                      root
                  ).as_posix()

                  if relative == manifest_rel:
                      continue

                  lines.append(
                      f"{sha256_file(path)}  "
                      f"{relative}"
                  )

              write_text(
                  manifest,
                  "\n".join(lines),
              )


          def verify_manifest(
              root: Path,
              manifest_rel: str,
          ) -> None:
              manifest = root / manifest_rel

              lines = manifest.read_text(
                  encoding="utf-8"
              ).splitlines()

              for line in lines:
                  if not line.strip():
                      continue

                  expected, relative = line.split(
                      "  ",
                      1,
                  )

                  actual = sha256_file(
                      root / relative
                  )

                  if actual != expected:
                      raise SystemExit(
                          "Checksum mismatch in "
                          f"{manifest_rel}: "
                          f"{relative}"
                      )


          def run_package(
