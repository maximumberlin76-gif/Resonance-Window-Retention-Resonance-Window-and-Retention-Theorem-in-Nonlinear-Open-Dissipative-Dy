                          ],
                          key=lambda row: row[
                              "priority_score"
                          ],
                          reverse=True,
                      )

                      sequence_rank = []

                      for sequence in cfg[
                          "hybrid_sequences"
                      ]:
                          score = (
                              sequence_score(
                                  sequence,
