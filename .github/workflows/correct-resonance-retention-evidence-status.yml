                  / "logs/engine_stdout.txt",
                  engine.stdout,
              )

              write_text(
                  package_root
                  / "logs/engine_stderr.txt",
                  engine.stderr,
              )

              if engine.returncode != 0:
                  raise SystemExit(
                      f"Engine failed in "
                      f"{package_root.name}: "
                      f"{engine.stderr}"
                  )

              smoke = subprocess.run(
                  [
                      sys.executable,
                      smoke_rel,
