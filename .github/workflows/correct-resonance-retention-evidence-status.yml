                          * chemistry_penalty
                          - 0.6
                          * dissipation_penalty
                      )


                  def sequence_score(
                      sequence,
                      gases,
                      default_reference,
                  ):
                      gas_terms = sum(
                          gas_score(
                              gases[name],
                              default_reference,
                          )
                          for name
                          in sequence
                      ) / len(sequence)

                      pair_terms = sum(
                          pair_score(
                              gases[
                                  sequence[index]
                              ],
                              gases[
                                  sequence[
                                      index + 1
                                  ]
                              ],
                          )
                          for index
                          in range(
                              len(sequence) - 1
                          )
                      ) / max(
                          1,
                          len(sequence) - 1,
                      )

                      chemistry_load = sum(
                          gases[name][
                              "chemistry_risk"
                          ]
                          for name
                          in sequence
                      ) / len(sequence)

                      retention_floor = min(
                          gases[name][
                              "retention"
                          ]
                          for name
                          in sequence
                      )

                      return (
                          gas_terms
                          + pair_terms
                          + 0.5
                          * retention_floor
                          - 0.5
                          * chemistry_load
                      )


                  def main():
                      parser = (
                          argparse.ArgumentParser()
                      )

