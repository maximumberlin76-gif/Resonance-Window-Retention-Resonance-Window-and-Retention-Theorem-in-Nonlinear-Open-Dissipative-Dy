name: Correct Resonance Retention Evidence Status

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correct-resonance-retention-evidence-status
  cancel-in-progress: false

jobs:
  correct-evidence-status:
    name: Correct computational evidence classification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile correction script
        run: |
          python3 -m py_compile tools/correct_evidence_status.py
          rm -rf tools/__pycache__

      - name: Apply verified correction
        run: python3 tools/correct_evidence_status.py

      - name: Verify changed file boundary
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess

          expected = {
              "README.md",
              "EVIDENCE_STATUS.md",
              "experimental_historical_archive/README.md",
              "theorems/README.md",
              "resonance_system_v35_HYBRID_MULTI_GAS_REGIME_MATRIX_TRUE.zip",
              "resonance_system_v35_1_AR_HE_HYBRID_ACOUSTIC_EM_RETENTION_TRUE.zip",
              "resonance_system_v35_2_AR_HE_H_DEEP_HYBRID_TESTS_TRUE.zip",
              "resonance_system_v35_3_HYBRID_RETENTION_THEOREM_PACKAGE_TRUE.zip",
              "FINAL_THEOREM_PACKAGE_REBUILT_TRUE.zip",
          }

          result = subprocess.run(
              ["git", "status", "--porcelain"],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = set()

          for line in result.stdout.splitlines():
              if not line.strip():
                  continue

              path = line[3:]

              if " -> " in path:
                  path = path.split(" -> ", 1)[1]

              changed.add(path)

          if changed != expected:
              raise SystemExit(
                  "Unexpected changed-file set.\n"
                  f"Expected: {sorted(expected)}\n"
                  f"Actual:   {sorted(changed)}"
              )

          print("Changed-file boundary verified.")

          for path in sorted(changed):
              print(f"- {path}")
          PY

      - name: Show correction summary
        run: |
          git status --short
          git diff --stat

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            README.md \
            EVIDENCE_STATUS.md \
            experimental_historical_archive/README.md \
            theorems/README.md \
            resonance_system_v35_HYBRID_MULTI_GAS_REGIME_MATRIX_TRUE.zip \
            resonance_system_v35_1_AR_HE_HYBRID_ACOUSTIC_EM_RETENTION_TRUE.zip \
            resonance_system_v35_2_AR_HE_H_DEEP_HYBRID_TESTS_TRUE.zip \
            resonance_system_v35_3_HYBRID_RETENTION_THEOREM_PACKAGE_TRUE.zip \
            FINAL_THEOREM_PACKAGE_REBUILT_TRUE.zip

          if git diff --cached --quiet; then
            echo "No correction changes staged."
            exit 1
          fi

          git commit \
            -m "Correct evidence classification across resonance retention packages"

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"
