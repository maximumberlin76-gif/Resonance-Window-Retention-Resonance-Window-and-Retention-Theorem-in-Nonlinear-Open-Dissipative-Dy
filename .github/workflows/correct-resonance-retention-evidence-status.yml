                  '''
                  #!/usr/bin/env python3
                  from __future__ import annotations

                  import argparse
                  import json
                  import random
                  from pathlib import Path


                  def mean(values):
                      return sum(values) / max(
                          1,
                          len(values),
                      )


                  def clamp(
                      value,
                      lower=0.0,
                      upper=1.0,
                  ):
                      return max(
                          lower,
                          min(
                              upper,
                              value,
                          ),
                      )


                  def gas_vector(
                      sequence,
                      gases,
                  ):
                      retention = mean(
                          [
                              gases[name][
                                  "retention"
                              ]
                              for name
                              in sequence
                          ]
                      )

                      response = mean(
                          [
                              gases[name][
                                  "response"
                              ]
                              for name
                              in sequence
                          ]
                      )

                      drift = mean(
                          [
                              gases[name]["drift"]
                              for name
                              in sequence
                          ]
                      )

                      dissipation = mean(
                          [
                              gases[name][
                                  "dissipation"
                              ]
                              for name
                              in sequence
                          ]
                      )

                      argon_bonus = (
                          0.12
                          if sequence[0] == "argon"
                          else 0.0
                      )

                      return (
                          retention,
                          response,
                          drift,
                          dissipation,
                          argon_bonus,
                      )


                  def screen_trial(
                      seed,
                      scenario,
                      channel_name,
                      channel,
                      cfg,
                  ):
                      rng = random.Random(seed)

                      thresholds = cfg[
                          "thresholds"
                      ]

                      (
                          retention,
                          response,
                          drift,
                          dissipation,
                          argon_bonus,
                      ) = gas_vector(
                          scenario["sequence"],
                          cfg["gases"],
                      )

                      stress = scenario["stress"]

                      reduction = scenario[
                          "drive_reduction"
                      ]

                      entry_proxy = (
                          channel["entry_gain"]
                          * response
                          * (
                              1.0
                              - 0.25 * stress
                          )
                          + argon_bonus
                      )

                      phase_proxy = (
                          channel[
                              "phase_precision"
                          ]
                          * (
                              0.55
                              + 0.45 * response
                          )
                          - 0.18
                          * drift
                          * stress
                      )

                      work_proxy = (
                          channel["entry_gain"]
                          * channel["acoustic"]
                          + 0.55
                          * channel["em"]
                          * channel[
                              "retention_gain"
                          ]
                      )

                      dissipation_proxy = (
                          dissipation
                          * channel[
                              "dissipation_penalty"
                          ]
                          + 0.20 * stress
                          + 0.08 * reduction
                      )

                      theta_proxy = clamp(
                          0.25
                          + 0.55 * entry_proxy
                          + 0.45 * work_proxy
                          + rng.gauss(
                              0,
                              0.045,
                          )
                          - 0.40
                          * dissipation_proxy,
                          0,
                          1.5,
                      )

                      balance_proxy = clamp(
                          0.10
                          + 0.45 * retention
                          + 0.20 * phase_proxy
                          - 0.35
                          * dissipation_proxy
                          + rng.gauss(
                              0,
                              0.035,
                          ),
                          -0.5,
                          1.2,
                      )

                      retention_tail_proxy = (
                          clamp(
                              retention
                              * channel[
                                  "retention_gain"
                              ]
                              + 0.35
                              * channel["em"]
                              - 0.30
                              * drift
                              * stress
                              - 0.22
                              * reduction
                              + argon_bonus
                              + rng.gauss(
                                  0,
                                  0.04,
                              ),
                              0,
                              1,
                          )
                      )

                      stable_periods_proxy = max(
                          0,
                          int(
                              round(
                                  2
                                  + 7
                                  * theta_proxy
                                  + 3
                                  * balance_proxy
                                  - 3
                                  * stress
                                  + rng.gauss(
                                      0,
                                      1.0,
                                  )
                              )
                          ),
                      )

                      collapse_risk_proxy = (
                          clamp(
                              0.20
                              + 0.55
                              * drift
                              * stress
                              + 0.35
                              * dissipation_proxy
                              - 0.40
                              * retention_tail_proxy
                              + rng.gauss(
                                  0,
                                  0.035,
                              ),
                              0,
                              1,
                          )
                      )

                      if (
                          theta_proxy
                          >= thresholds[
                              "theta_crit"
                          ]
                          and balance_proxy
                          >= thresholds[
                              "balance_crit"
                          ]
                          and retention_tail_proxy
                          >= thresholds[
                              "retention_min"
                          ]
                          and stable_periods_proxy
                          >= thresholds[
                              "stable_periods_min"
                          ]
                          and collapse_risk_proxy
                          <= thresholds[
                              "collapse_limit"
                          ]
                      ):
                          outcome = (
                              "screening_candidate"
                          )

                      elif (
                          theta_proxy
                          >= thresholds[
                              "theta_crit"
                          ]
                          and retention_tail_proxy
                          < thresholds[
                              "retention_min"
                          ]
                      ):
                          outcome = (
                              "accumulation_without_"
                              "retention"
                          )

                      elif (
                          theta_proxy
                          < thresholds[
                              "theta_crit"
                          ]
                          and phase_proxy >= 0.65
                      ):
                          outcome = (
                              "phase_alignment_"
                              "without_work"
                          )

                      elif (
                          collapse_risk_proxy
                          > thresholds[
                              "collapse_limit"
                          ]
                      ):
                          outcome = (
                              "collapse_after_"
                              "drive_reduction"
                          )

                      else:
                          outcome = "no_window"

                      return {
                          "seed": seed,
                          "scenario": (
                              scenario["name"]
                          ),
                          "sequence": (
                              scenario["sequence"]
                          ),
                          "channel": channel_name,
                          "theta_N_proxy": round(
                              theta_proxy,
                              6,
                          ),
                          "balance_periodic_proxy": (
                              round(
                                  balance_proxy,
                                  6,
                              )
                          ),
                          "retention_tail_proxy": (
                              round(
                                  retention_tail_proxy,
                                  6,
                              )
                          ),
                          "stable_periods_proxy": (
                              stable_periods_proxy
                          ),
                          "collapse_risk_proxy": (
                              round(
                                  collapse_risk_proxy,
                                  6,
                              )
                          ),
                          "outcome": outcome,
                      }


                  def summarize(items):
                      total = len(items)

                      candidate_count = sum(
                          1
                          for row in items
                          if row["outcome"]
                          == "screening_candidate"
                      )

                      return {
                          "count": total,
                          "candidate_count": (
                              candidate_count
                          ),
                          "candidate_ratio": round(
                              candidate_count
                              / max(
                                  1,
                                  total,
                              ),
                              6,
                          ),
                          "mean_theta_N_proxy": (
                              round(
                                  mean(
                                      [
                                          row[
                                              "theta_N_proxy"
                                          ]
                                          for row
                                          in items
                                      ]
                                  ),
                                  6,
                              )
                          ),
                          "mean_balance_periodic_"
                          "proxy": round(
                              mean(
                                  [
                                      row[
                                          "balance_periodic_"
                                          "proxy"
                                      ]
                                      for row
                                      in items
                                  ]
                              ),
                              6,
                          ),
                          "mean_retention_tail_"
                          "proxy": round(
                              mean(
                                  [
                                      row[
                                          "retention_tail_"
                                          "proxy"
                                      ]
                                      for row
                                      in items
                                  ]
                              ),
                              6,
                          ),
                          "mean_collapse_risk_"
                          "proxy": round(
                              mean(
                                  [
                                      row[
                                          "collapse_risk_"
                                          "proxy"
                                      ]
                                      for row
                                      in items
                                  ]
                              ),
                              6,
                          ),
                          "outcomes": {
                              outcome: sum(
                                  1
                                  for row in items
                                  if row["outcome"]
                                  == outcome
                              )
                              for outcome in sorted(
                                  {
                                      row["outcome"]
                                      for row
                                      in items
                                  }
                              )
                          },
                      }
                                        def main():
                      parser = (
                          argparse.ArgumentParser()
                      )

                      parser.add_argument(
                          "--outdir",
                          default="results",
                      )

                      args = parser.parse_args()

                      with open(
                          "configs/config.json",
                          "r",
                          encoding="utf-8",
                      ) as handle:
                          cfg = json.load(handle)

                      rows = []

                      base_seed = cfg["seed"]

                      trial_count = cfg[
                          "monte_carlo_trials_"
                          "per_scenario"
                      ]

                      for (
                          scenario_index,
                          scenario,
                      ) in enumerate(
                          cfg["scenarios"]
                      ):
                          for (
                              channel_name,
                              channel,
                          ) in cfg[
                              "channels"
                          ].items():
                              for trial_index in range(
                                  trial_count
                              ):
                                  trial_seed = (
                                      base_seed
                                      + scenario_index
                                      * 10000
                                      + trial_index
                                      * 97
                                      + len(
                                          channel_name
                                      )
                                  )

                                  rows.append(
                                      screen_trial(
                                          trial_seed,
                                          scenario,
                                          channel_name,
                                          channel,
                                          cfg,
                                      )
                                  )

                      outcomes = {}
                      by_channel = {}
                      by_scenario = {}

                      for row in rows:
                          outcome = row["outcome"]

                          outcomes[outcome] = (
