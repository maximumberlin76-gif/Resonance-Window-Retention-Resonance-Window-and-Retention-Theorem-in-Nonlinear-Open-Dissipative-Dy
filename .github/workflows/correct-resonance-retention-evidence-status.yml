      - name: Verify changed file boundary
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess

          expected = {
              "README.md",
              "EVIDENCE_STATUS.md",
              (
                  "experimental_historical_archive/"
                  "README.md"
              ),
              "theorems/README.md",
              (
                  "resonance_system_v35_"
                  "HYBRID_MULTI_GAS_REGIME_"
                  "MATRIX_TRUE.zip"
              ),
              (
                  "resonance_system_v35_1_"
                  "AR_HE_H_HYBRID_ACOUSTIC_"
                  "EM_RETENTION_TRUE.zip"
              ),
              (
                  "resonance_system_v35_2_"
                  "AR_HE_H_DEEP_HYBRID_"
                  "TESTS_TRUE.zip"
              ),
              (
                  "resonance_system_v35_3_"
                  "HYBRID_RETENTION_THEOREM_"
                  "PACKAGE_TRUE.zip"
              ),
              (
                  "FINAL_THEOREM_PACKAGE_"
                  "REBUILT_TRUE.zip"
              ),
          }

          result = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          changed = set()

          for line in result.stdout.splitlines():
              if not line.strip():
                  continue

              path = line[3:]

              if " -> " in path:
                  path = path.split(
                      " -> ",
                      1,
                  )[1]

              changed.add(path)

          if changed != expected:
              raise SystemExit(
                  "Unexpected changed-file set.\n"
                  f"Expected: {sorted(expected)}\n"
                  f"Actual:   {sorted(changed)}"
              )

          print(
              "Changed-file boundary verified:"
          )

          for path in sorted(changed):
              print(f"- {path}")
          PY

