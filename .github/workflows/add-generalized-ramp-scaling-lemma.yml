name: Add Generalized Ramp-Scaling Lemma to Resonance Retention

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-generalized-ramp-scaling-lemma-resonance-retention
  cancel-in-progress: false

jobs:
  add-lemma:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply and verify generalized scaling lemma
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYCODE'

          from __future__ import annotations

          import hashlib
          import json
          import os
          import tempfile
          import zipfile
          from fractions import Fraction
          from pathlib import Path
          from textwrap import dedent

          ROOT = Path.cwd()
          FINAL = "FINAL_THEOREM_PACKAGE_REBUILT_TRUE.zip"
          ZIP_TIME = (2026, 7, 29, 0, 0, 0)
          EXPECTED = {
              "README.md": "79cc1eb05361b9bc4a6aa38573a1dd3bd79c30471797970bb6c87c6f38ebfcb3",
              "EVIDENCE_STATUS.md": "0e602290a2a4b7c330d45820dbfa47d37e08c7272bad22c39b16d01c4cefda6d",
              "theorems/README.md": "9e9bb48d28c7c139b905f2b8932bc343b04434eaa7c4b614af17125b078f5e6e",
              FINAL: "300b519c659d2a116b006556b039b1af01f9daef698e5e189f23da849b41eb8e",
          }


          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()


          def read(path: Path) -> str:
              return path.read_text(encoding="utf-8")


          def write(path: Path, text: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  text.rstrip() + "\n",
                  encoding="utf-8",
                  newline="\n",
              )


          def replace_range(
              text: str,
              start: str,
              end: str,
              replacement: str,
          ) -> str:
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(
                      f"Non-unique replacement range: "
                      f"{start!r} -> {end!r}"
                  )

              left = text.index(start)
              right = text.index(end, left)

              return (
                  text[:left]
                  + replacement.rstrip()
                  + "\n\n"
                  + text[right:]
              )


          def extract(
              source: Path,
              target: Path,
          ) -> None:
              with zipfile.ZipFile(source) as archive:
                  for item in archive.infolist():
                      relative = Path(item.filename)

                      if (
                          relative.is_absolute()
                          or ".." in relative.parts
                      ):
                          raise SystemExit(
                              f"Unsafe ZIP member: "
                              f"{item.filename}"
                          )

                  archive.extractall(target)


          def manifest(
              root: Path,
              relative: str,
          ) -> None:
              rows = []

              for path in sorted(
                  item
                  for item in root.rglob("*")
                  if item.is_file()
              ):
                  member = path.relative_to(
                      root
                  ).as_posix()

                  if member != relative:
                      rows.append(
                          f"{sha(path)}  {member}"
                      )

              write(
                  root / relative,
                  "\n".join(rows),
              )


          def verify_manifest(
              root: Path,
              relative: str,
          ) -> None:
              for row in read(
                  root / relative
              ).splitlines():
                  if not row.strip():
                      continue

                  expected, member = row.split(
                      "  ",
                      1,
                  )

                  if sha(root / member) != expected:
                      raise SystemExit(
                          f"Manifest mismatch: {member}"
                      )


          def pack(
              source: Path,
              target: Path,
          ) -> None:
              with zipfile.ZipFile(
                  target,
                  "w",
                  zipfile.ZIP_DEFLATED,
                  compresslevel=9,
              ) as archive:
                  for path in sorted(
                      item
                      for item in source.rglob("*")
                      if item.is_file()
                  ):
                      relative = path.relative_to(
                          source
                      ).as_posix()

                      info = zipfile.ZipInfo(
                          relative,
                          ZIP_TIME,
                      )

                      info.compress_type = (
                          zipfile.ZIP_DEFLATED
                      )

                      info.create_system = 3

                      mode = (
                          0o755
                          if path.suffix == ".py"
                          else 0o644
                      )

                      info.external_attr = (
                          (mode & 0xFFFF) << 16
                      )

                      archive.writestr(
                          info,
                          path.read_bytes(),
                      )


          def verify_zip(path: Path) -> None:
              with zipfile.ZipFile(path) as archive:
                  damaged = archive.testzip()

                  if damaged:
                      raise SystemExit(
                          f"ZIP integrity failure: "
                          f"{path.name}/{damaged}"
                      )


          for relative, expected in EXPECTED.items():
              path = ROOT / relative

              if not path.is_file():
                  raise SystemExit(
                      f"Missing source file: {relative}"
                  )

              actual = sha(path)

              if actual != expected:
                  raise SystemExit(
                      f"Source hash mismatch: {relative}\n"
                      f"expected: {expected}\n"
                      f"actual:   {actual}"
                  )


          LEMMA = dedent("""\
          # Generalized Critical Ramp-Scaling Lemma

          For the nonnegative endogenous coherence amplitude C ≥ 0, consider:

          ```text
          dC/dt = vtC − gC^n
          v > 0, g > 0, n > 1
          ```

          Set:

          ```text
          t = v^(−α)τ
          C = g^(−1/(n−1))v^βy
          ```

          The derivative, linearly ramped critical term, and nonlinear saturation term carry the exponents:

          ```text
          β + α
          1 − α + β
          nβ
          ```

          Canonical balance requires:

          ```text
          β + α = 1 − α + β = nβ
          ```

          Therefore:

          ```text
          α = 1/2
          β = 1/(2(n−1))
          ```

          The exact rescaling is:

          ```text
          t = v^(−1/2)τ
          C = g^(−1/(n−1))v^(1/(2(n−1)))y
          ```

          and the reduced equation becomes:

          ```text
          dy/dτ = τy − y^n
          ```

          Thus:

          ```text
          t_critical ~ v^(−1/2)
          t_delay ~ v^(−1/2)
          C_critical ~ g^(−1/(n−1))v^(1/(2(n−1)))
          ```

          | Saturation order n | Amplitude exponent in v | Time exponent in v |
          |---:|---:|---:|
          | 2 | 1/2 | −1/2 |
          | 3 | 1/4 | −1/2 |
          | 4 | 1/6 | −1/2 |
          | 5 | 1/8 | −1/2 |

          The temporal exponent −1/2 is fixed by the derivative–ramp balance and is independent of the nonlinear saturation order while the ramp retains the form vtC. The saturation order changes only the critical-amplitude exponent.

          For a signed amplitude, use the symmetry-compatible saturation `−g|C|^(n−1)C`; the same exponent balance follows.

          ## Geometric Dimensional Closure

          For d independent characteristic coherence extents:

          ```text
          V_coh,d ∝ ∏_(i=1)^d C_i
          ```

          Under isotropy `C_i ~ C`:

          ```text
          V_coh,d ∝ C^d
          ```

          If the coherent d-dimensional measure supplies the nonlinear saturation closure:

          ```text
          n = d
          ```

          For d > 1:

          ```text
          C_critical ~ g^(−1/(d−1))v^(1/(2(d−1)))
          t_delay ~ v^(−1/2)
          ```

          For the full-volume three-dimensional realization:

          ```text
          V_coh,3 ∝ C_xC_yC_z
          C_x ~ C_y ~ C_z ~ C
          V_coh,3 ∝ C³
          ```

          The cubic specialization is:

          ```text
          dC/dt = vtC − gC³
          C_critical ~ g^(−1/2)v^(1/4)
          t_delay ~ v^(−1/2)
          ```

          Geometric closure and symmetry closure are distinct model arguments. Geometric closure predicts a dimension-sensitive saturation order. The independent symmetry `C → −C` excludes even powers in a sign-symmetric scalar amplitude equation. In the three-dimensional EDS specialization both routes support C³, while the delay exponent remains independent of the saturation order.

          A cross-dimensional realization can test the geometric component: changing effective dimension should change the amplitude exponent according to `1/(2(n−1))`, while the temporal exponent remains −1/2 provided the ramp remains `vtC`.
          """)


          EVIDENCE = dedent("""\
          ## Critical Scaling Synchronization

          The corrected cubic specialization is:

          ```text
          dC/dt = vtC − gC³
          C_critical ~ g^(−1/2)v^(1/4)
          t_delay ~ v^(−1/2)
          ```

          The generalized linearly ramped class is:

          ```text
          dC/dt = vtC − gC^n
          C_critical ~ g^(−1/(n−1))v^(1/(2(n−1)))
          t_delay ~ v^(−1/2)
          ```

          for g > 0 and n > 1.

          The amplitude exponent depends on the saturation order. The temporal exponent −1/2 does not: it is fixed by the derivative–ramp balance while the critical ramp retains the form vtC.

          Under geometric dimensional closure, `V_coh,d ∝ C^d` and `n = d`. The full-volume three-dimensional specialization gives `V_coh,3 ∝ C³` and recovers the cubic amplitude exponent 1/4 without changing the delay exponent.
          """)


          readme = read(
              ROOT / "README.md"
          )

          evidence = read(
              ROOT / "EVIDENCE_STATUS.md"
          )

          theorems = read(
              ROOT / "theorems/README.md"
          )


          for marker in [
              "# Generalized Critical Ramp-Scaling Lemma",
              "dC/dt = vtC − gC^n",
          ]:
              if (
                  marker in readme
                  or marker in evidence
                  or marker in theorems
              ):
                  raise SystemExit(
                      f"Generalized lemma already exists: "
                      f"{marker}"
                  )


          readme = replace_range(
              readme,
              "# Cubic Critical Form and Scaling\n",
              "- Ω(t)\n",
              LEMMA,
          )


          evidence = replace_range(
              evidence,
              "## Critical Scaling Synchronization\n",
              "## Successor Dynamic Evidence Requirements\n",
              EVIDENCE,
          )


          if theorems.count(
              "# Repository Structure\n"
          ) != 1:
              raise SystemExit(
                  "theorems/README.md insertion "
                  "anchor mismatch"
              )


          theorems = theorems.replace(
              "# Repository Structure\n",
              LEMMA
              + "\n# Repository Structure\n",
              1,
          )


          theorems = theorems.replace(
              "- hybrid stabilization formalism\n",
              "- hybrid stabilization formalism\n\n"
              "- generalized critical "
              "ramp-scaling lemma\n\n"
              "- geometric dimensional closure\n",
              1,
          )


          with tempfile.TemporaryDirectory(
              prefix="rwr-final-lemma-"
          ) as temporary:
              temp = Path(temporary)
              final_root = temp / "final"

              extract(
                  ROOT / FINAL,
                  final_root,
              )

              final_readme = read(
                  final_root / "README.md"
              )

              unified = read(
                  final_root
                  / "theorems/unified_theorem_frame.md"
              )


              old_chain = dedent("""\
              Resonance as process
              → Resonance Window Theorem
              → Hybrid Retention Theorem
              → computational evidence classification
              → multi-gas variability
              → reproducibility archive
              """).strip()


              new_chain = dedent("""\
              Resonance as process
              → Generalized Critical Ramp-Scaling Lemma
              → Resonance Window Theorem
              → Hybrid Retention Theorem
              → computational evidence classification
              → multi-gas variability
              → reproducibility archive
              """).strip()


              if final_readme.count(
                  old_chain
              ) != 1:
                  raise SystemExit(
                      "FINAL package proof-chain "
                      "marker mismatch"
                  )


              final_readme = final_readme.replace(
                  old_chain,
                  new_chain,
                  1,
              )


              summary = dedent("""\
              ## Generalized Critical Ramp-Scaling Lemma

              For `dC/dt = vtC − gC^n`, with `g > 0` and `n > 1`:

              ```text
              t_delay ~ v^(−1/2)
              C_critical ~ g^(−1/(n−1))v^(1/(2(n−1)))
              ```

              The delay exponent is independent of the saturation order. Under geometric dimensional closure, `V_coh,d ∝ C^d` and `n = d`; the full-volume three-dimensional specialization gives `V_coh,3 ∝ C³`.
              """)


              final_readme = final_readme.replace(
                  "## Final Interpretation\n",
                  summary
                  + "\n## Final Interpretation\n",
                  1,
              )


              write(
                  final_root / "README.md",
                  final_readme,
              )


              write(
                  final_root
                  / (
                      "theorems/"
                      "generalized_ramp_scaling_lemma.md"
                  ),
                  LEMMA,
              )


              unified += dedent("""\

              ## Generalized Critical Ramp-Scaling Support

              ```text
              dC/dt = vtC − gC^n
              t_delay ~ v^(−1/2)
              C_critical ~ g^(−1/(n−1))v^(1/(2(n−1)))
              ```

              Under geometric dimensional closure:

              ```text
              V_coh,d ∝ C^d
              n = d
              V_coh,3 ∝ C³
              ```
              """)


              write(
                  final_root
                  / "theorems/unified_theorem_frame.md",
                  unified,
              )


              index_path = (
                  final_root / "PACKAGE_INDEX.json"
              )

              index = json.loads(
                  read(index_path)
              )

              index["lemmas"] = [
                  (
                      "Generalized Critical "
                      "Ramp-Scaling Lemma"
                  )
              ]


              index.setdefault(
                  "added_layers",
                  [],
              ).append(
                  (
                      "theorems/"
                      "generalized_ramp_scaling_lemma.md"
                  )
              )


              index["critical_scaling"] = {
                  "generalized_equation": (
                      "dC/dt = vtC - gC^n"
                  ),
                  "amplitude_scale": (
                      "g^(-1/(n-1)) "
                      "v^(1/(2(n-1)))"
                  ),
                  "delay_scale": "v^(-1/2)",
                  "geometric_closure": "n = d",
                  (
                      "three_dimensional_"
                      "specialization"
                  ): (
                      "V_coh,3 proportional to C^3"
                  ),
              }


              write(
                  index_path,
                  json.dumps(
                      index,
                      indent=2,
                      ensure_ascii=False,
                  ),
              )


              report_path = (
                  final_root
                  / (
                      "validation/"
                      "package_integrity_report.json"
                  )
              )


              report = json.loads(
                  read(report_path)
              )


              report["status"] = (
                  "generalized_ramp_scaling_"
                  "lemma_added_and_rechecked"
              )


              report["file_count"] = 78


              write(
                  report_path,
                  json.dumps(
                      report,
                      indent=2,
                      ensure_ascii=False,
                  ),
              )


              manifest(
                  final_root,
                  "checksums/SHA256SUMS.txt",
              )


              verify_manifest(
                  final_root,
                  "checksums/SHA256SUMS.txt",
              )


              file_count = len(
                  [
                      path
                      for path in final_root.rglob("*")
                      if path.is_file()
                  ]
              )


              if file_count != 78:
                  raise SystemExit(
                      "FINAL package must contain "
                      "exactly 78 files"
                  )


              rebuilt = temp / FINAL


              pack(
                  final_root,
                  rebuilt,
              )


              verify_zip(
                  rebuilt
              )


              os.replace(
                  rebuilt,
                  ROOT / FINAL,
              )


          write(
              ROOT / "README.md",
              readme,
          )


          write(
              ROOT / "EVIDENCE_STATUS.md",
              evidence,
          )


          write(
              ROOT / "theorems/README.md",
              theorems,
          )


          for n in range(2, 21):
              alpha = Fraction(1, 2)

              beta = Fraction(
                  1,
                  2 * (n - 1),
              )

              if not (
                  beta + alpha
                  == 1 - alpha + beta
                  == n * beta
              ):
                  raise SystemExit(
                      f"Exponent balance failed "
                      f"for n={n}"
                  )


          required = {
              "README.md": [
                  (
                      "# Generalized Critical "
                      "Ramp-Scaling Lemma"
                  ),
                  (
                      "C_critical ~ "
                      "g^(−1/(n−1))"
                      "v^(1/(2(n−1)))"
                  ),
                  "V_coh,3 ∝ C_xC_yC_z",
              ],
              "EVIDENCE_STATUS.md": [
                  (
                      "The generalized linearly "
                      "ramped class is:"
                  ),
                  (
                      "The temporal exponent "
                      "−1/2 does not"
                  ),
                  "V_coh,3 ∝ C³",
              ],
              "theorems/README.md": [
                  "β + α = 1 − α + β = nβ",
                  "V_coh,d ∝ C^d",
                  "dC/dt = vtC − gC³",
              ],
          }


          for relative, markers in required.items():
              text = read(
                  ROOT / relative
              )

              for marker in markers:
                  if marker not in text:
                      raise SystemExit(
                          f"Missing marker in "
                          f"{relative}: {marker}"
                      )


          for path in ROOT.rglob("*"):
              if (
                  path.is_file()
                  and ".git" not in path.parts
                  and path.suffix.lower()
                  in {
                      ".md",
                      ".txt",
                      ".cff",
                  }
              ):
                  text = read(path)

                  for stale in [
                      "t_delay ~ v^(−1/3)",
                      "t_delay ~ v^(-1/3)",
                      "t_delay ~ v_eff^(−1/3)",
                      "t_delay ~ v_eff^(-1/3)",
                  ]:
                      if stale in text:
                          raise SystemExit(
                              f"Obsolete delay scaling "
                              f"remains in {path}"
                          )


          verify_zip(
              ROOT / FINAL
          )


          with tempfile.TemporaryDirectory(
              prefix="rwr-final-verify-"
          ) as temporary:
              final_root = (
                  Path(temporary) / "final"
              )


              extract(
                  ROOT / FINAL,
                  final_root,
              )


              verify_manifest(
                  final_root,
                  "checksums/SHA256SUMS.txt",
              )


              lemma_path = (
                  final_root
                  / (
                      "theorems/"
                      "generalized_ramp_scaling_lemma.md"
                  )
              )


              if not lemma_path.is_file():
                  raise SystemExit(
                      "FINAL package lemma file "
                      "is missing"
                  )


              report = json.loads(
                  read(
                      final_root
                      / (
                          "validation/"
                          "package_integrity_report.json"
                      )
                  )
              )


              if report.get(
                  "file_count"
              ) != 78:
                  raise SystemExit(
                      "FINAL package file-count "
                      "report mismatch"
                  )


          print(
              "Generalized resonance-retention "
              "scaling lemma applied and verified."
          )
          PYCODE

      - name: Remove completed one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/add-generalized-ramp-scaling-lemma.yml

      - name: Verify exact changed-file boundary
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' \
            '.github/workflows/add-generalized-ramp-scaling-lemma.yml' \
            'EVIDENCE_STATUS.md' \
            'FINAL_THEOREM_PACKAGE_REBUILT_TRUE.zip' \
            'README.md' \
            'theorems/README.md' \
            | sort > /tmp/expected-files.txt

          git status --porcelain=v1 \
            | cut -c4- \
            | sort > /tmp/actual-files.txt

          diff -u \
            /tmp/expected-files.txt \
            /tmp/actual-files.txt

          git diff --check

          echo "Exact changed-file boundary verified."

      - name: Commit generalized lemma
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generalized-lemma changes were staged."
            exit 1
          fi

          git commit \
            -m "Add generalized resonance-retention scaling lemma"

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"
